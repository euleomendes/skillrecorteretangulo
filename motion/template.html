<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'XB';src:url('fonts/Inter-ExtraBold.otf')}
@font-face{font-family:'SB';src:url('fonts/Inter-SemiBold.otf')}
@font-face{font-family:'MD';src:url('fonts/Inter-Medium.otf')}
@font-face{font-family:'SF';src:url('fonts/InstrumentSerif-Italic.ttf');font-style:italic}
:root{--y:#FFD21F;--ink:#0d0d0d;--red:#E5322D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#fff}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;font-family:'SB'}
.bg{position:absolute;inset:0}
#bgL{background:
  radial-gradient(circle at 15% 8%,rgba(255,196,60,.16),transparent 45%),
  radial-gradient(circle,rgba(0,0,0,.075) 1.6px,transparent 2px) 0 0/26px 26px,#fff}
#bgD{background:
  radial-gradient(circle at 50% 38%,rgba(255,190,0,.20),transparent 58%),
  radial-gradient(circle,rgba(255,210,31,.16) 1.8px,transparent 2.4px) 0 0/34px 34px,#0a0a0b}
#face{position:absolute;overflow:hidden;background:#000}
#face img{position:absolute;left:0;top:0;transform-origin:0 0}
#ring{position:absolute;pointer-events:none;border-style:solid;border-color:var(--y)}
.scene{position:absolute;inset:0;pointer-events:none}
.abs{position:absolute}
.tl{font-family:'XB';font-size:72px;line-height:1.02;letter-spacing:-2.4px;white-space:nowrap}
.sf{font-family:'SF';font-style:italic;font-weight:400;letter-spacing:-1px;font-size:1.12em}
.dark .tl{color:#fff}.light .tl{color:var(--ink)}
.pill{position:absolute;white-space:nowrap;border-radius:16px;padding:13px 24px;font-family:'XB';font-size:30px;letter-spacing:-.6px}
.emoji{font-family:'Apple Color Emoji',sans-serif;display:inline-block;vertical-align:-.08em;margin-right:9px}.ico .emoji{margin:0;font-size:86px;line-height:1}
.pill.y{background:var(--y);color:var(--ink)}
.pill.k{background:var(--ink);color:#fff}
.pill.w{background:#fff;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.16)}
.pill.r{background:var(--red);color:#fff}
.plate{position:absolute;left:60px;width:600px;background:#0b0b0c;border-radius:22px;border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 44px rgba(0,0,0,.45)}
.card{position:absolute;left:60px;width:600px;background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.ico{position:absolute;display:flex;align-items:center;justify-content:center}
svg{display:block}
#px{position:absolute;inset:0;pointer-events:none}
#cut{position:absolute;pointer-events:none;transform-origin:0 0}
#guide{position:absolute;pointer-events:none;display:none}
#guide div{position:absolute;border:2px dashed #ff2d95;background:rgba(255,45,149,.07)}
</style></head>
<body><div id="stage">
<div class="bg" id="bgL"></div><div class="bg" id="bgD"></div>
<div id="face"><img id="fr"></div><div id="ring"></div><img id="cut">
<div id="layer"></div>
<canvas id="px" width="720" height="1280"></canvas>
<div id="guide"><div style="left:47px;top:167px;width:650px;height:573px"></div><div style="left:47px;top:740px;width:544px;height:283px"></div></div>
</div>
<script>
const SCENES = /*SCENES*/[];
const TOTAL = /*TOTAL*/10;
const Y='#FFD21F';
const clamp=x=>Math.min(1,Math.max(0,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const E={out:x=>1-Math.pow(1-x,3),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 back:x=>{const c=1.70158,k=c+1;return 1+k*Math.pow(x-1,3)+c*Math.pow(x-1,2)}};
const lerp=(a,b,q)=>a+(b-a)*q;
const ICON={
 bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'
};
const geom={
 card:{x:60,y:660,w:600,h:640,r:44,s:.9,ox:24,oy:285,bw:5},
 full:{x:0,y:0,w:720,h:1280,r:0,s:1,ox:0,oy:0,bw:0}};
const lay=s=>s.layout==='full'?'full':'card';
const isDark=s=>s.layout==='dark';

const escapeText = value => String(value ?? '').replace(/[&<>"']/g, ch =>
  ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[ch]));
function fmt(t){return String(t).split('|').map(l=>'<div class="tl">'+escapeText(l).replace(/\{(.+?)\}/g,'<i class="sf">$1</i>')+'</div>').join('')}
const layer=document.getElementById('layer');
function mk(cls,html,css){const d=document.createElement('div');d.className=cls;d.innerHTML=html||'';Object.assign(d.style,css||{});return d}

// ---- construtores de cena: devolvem {root, upd(u,dur)} ----
function build(sc){
  const root=mk('scene '+(isDark(sc)||sc.layout==='full'?'dark':'light'));layer.appendChild(root);
  const items=[];           // {el, t0, kind}
  let n=0;
  const add=(el,kind,o={})=>{root.appendChild(el);items.push({el,kind,t0:.12+(o.delay??n*.12),o});n++;return el};
  const ty=sc.titleY??130;
  if(sc.title){
    const lines=sc.title.split('|');
    lines.forEach((l,i)=>add(mk('tl-wrap',fmt(l),{position:'absolute',left:'60px',top:(ty+i*80)+'px'}),'slide'));
  }
  (sc.pills||[]).forEach(p=>{
    const el=mk('pill '+(p.style||'y'),p.emoji?'<span class="emoji">'+escapeText(p.emoji)+'</span>'+escapeText(p.text):escapeText(p.text),{left:p.x+'px',top:p.y+'px'});
    el.dataset.rot=p.rot||0;add(el,'pop',{delay:p.delay});
  });
  const c=sc.card;
  if(c){
    if(c.type==='bars'){
      const base=c.y||420;
      c.rows.forEach((r,i)=>{
        const lab=mk('', escapeText(r.label),{position:'absolute',left:'60px',top:(base+i*100)+'px',color:'#fff',fontFamily:'SB',fontSize:'28px'});
        const track=mk('',"",{position:'absolute',left:'60px',top:(base+i*100+42)+'px',width:'600px',height:'26px',borderRadius:'13px',background:'rgba(255,255,255,.1)'});
        const fill=mk('',"",{position:'absolute',left:0,top:0,height:'26px',borderRadius:'13px',width:'0px',
          background:r.style==='y'?Y:'repeating-linear-gradient(135deg,#fff 0 14px,#d9d9d9 14px 28px)'});
        track.appendChild(fill);
        const g=mk('',"",{position:'absolute',inset:0});g.appendChild(lab);g.appendChild(track);
        g.dataset.w=r.w;g._fill=fill;add(g,'bar',{delay:.3+i*.45});
      });
    }
    if(c.type==='counter'){
      const el=mk('plate','',{top:(c.y||190)+'px',height:'150px'});
      el.innerHTML='<div class="ico" style="left:22px;top:25px;width:100px;height:100px;border-radius:24px;background:'+Y+';font-family:XB;font-size:44px;color:#0d0d0d">'+escapeText(c.mark||'+')+'</div>'+
       '<div class="abs num" style="left:148px;top:14px;font-family:XB;font-size:96px;letter-spacing:-3px;color:'+Y+'">0</div>'+
       '<div class="abs" style="right:28px;top:30px;font-family:SF;font-style:italic;font-size:44px;color:#fff">'+escapeText(c.unit)+'</div>'+
       '<div class="abs" style="right:28px;top:92px;font-family:MD;font-size:20px;letter-spacing:1px;color:#a9a9a9;text-align:right">'+escapeText(c.caption)+'</div>';
      el._num=el.querySelector('.num');el.dataset.val=c.value;el.dataset.pre=c.prefix||'';add(el,'counter',{delay:.15});
    }
    if(c.type==='nameplate'){
      const el=mk('plate','',{top:(c.y||160)+'px',height:'133px',width:'530px'});
      el.innerHTML='<div class="ico" style="left:24px;top:23px;width:88px;height:88px;border-radius:44px;background:'+Y+';font-family:XB;font-size:44px;color:#0d0d0d">'+escapeText(c.initials)+'</div>'+
       '<div class="abs" style="left:132px;top:15px;font-family:XB;font-size:50px;letter-spacing:-1.5px;color:#fff">'+escapeText(c.name)+'</div>'+
       '<div class="abs" style="left:132px;top:75px;font-family:SF;font-style:italic;font-size:30px;color:'+Y+'">'+escapeText(c.role)+'</div>';
      add(el,'slide',{delay:.1});
    }
    if(c.type==='follow'){
      const el=mk('plate',escapeText(c.text),{top:c.y+'px',width:'530px',height:'104px',display:'grid',
        placeItems:'center',fontFamily:'XB',fontSize:'39px',color:Y});
      add(el,'slide',{delay:.1});
    }
    if(c.type==='bigicon'){
      const el=mk('ico',c.emoji?'<span class="emoji">'+escapeText(c.emoji)+'</span>':'<div style="width:70px;height:70px">'+ICON[c.icon]+'</div>',{left:'270px',top:(c.y||190)+'px',width:'180px',height:'180px',borderRadius:'44px',background:Y,boxShadow:'0 0 90px rgba(255,210,31,.55)'});
      if(!c.emoji){el.firstChild.style.width='96px';el.firstChild.style.height='96px'}add(el,'pop',{delay:.1,rot0:-12});
    }
    if(c.type==='stamp'){
      const el=mk('card','',{top:(c.y||340)+'px',height:'120px'});
      el.innerHTML='<div class="ico" style="left:26px;top:30px;width:60px;height:60px;border-radius:30px;background:#18B26B"><div style="width:34px;height:34px">'+ICON.check+'</div></div>'+
       '<div class="abs" style="left:108px;top:30px;font-family:XB;font-size:36px;letter-spacing:-1px;color:#0d0d0d;white-space:nowrap">'+escapeText(c.text)+'</div>';
      add(el,'pop',{delay:.2});
      const st=mk('pill r',escapeText(c.stamp),{left:'330px',top:((c.y||340)+78)+'px',fontSize:'40px',padding:'14px 30px',borderRadius:'18px'});
      st.dataset.rot=-6;add(st,'stamp',{delay:c.stampAt??1.3});
    }
    if(c.type==='camicon'){
      const el=mk('ico',c.emoji?'<span class="emoji">'+escapeText(c.emoji)+'</span>':'<div style="width:92px;height:92px">'+ICON.cam+'</div>',{left:'60px',top:(c.y||400)+'px',width:'170px',height:'170px',borderRadius:'40px',background:'#fff',boxShadow:'0 16px 44px rgba(0,0,0,.2)'});
      add(el,'pop',{delay:.35});
      const dot=mk('',"",{position:'absolute',left:'200px',top:((c.y||400)-8)+'px',width:'30px',height:'30px',borderRadius:'15px',background:'var(--red)',boxShadow:'0 0 0 6px #fff'});
      dot._blink=1;add(dot,'pop',{delay:.5});
    }
  }
  return {root,items,sc};
}
const built=SCENES.map(build);

// ---- quadradinhos de transição ----
const px=document.getElementById('px').getContext('2d');
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const COLS=8,SZ=90,ROWS=15;
const sq=[];for(let i=0;i<COLS*ROWS;i++){sq.push({r:rnd(),on:rnd()<.5,c:['#FFD21F','#FFD21F','#0d0d0d','#fff'][Math.floor(rnd()*4)]})}
function drawPx(t){
  px.clearRect(0,0,720,1280);
  for(let k=1;k<SCENES.length;k++){
    if(SCENES[k].plain||SCENES[k-1].plain)continue;
    const tb=SCENES[k].start;if(Math.abs(t-tb)>.5)continue;
    sq.forEach((s,i)=>{if(!s.on)return;
      const a=tb-.30+s.r*.25,b=tb+.05+s.r*.25;
      let al=Math.min(clamp((t-a)/.08),1-clamp((t-b)/.12));
      if(al<=0)return;px.globalAlpha=al;px.fillStyle=s.c;
      px.fillRect((i%COLS)*SZ,Math.floor(i/COLS)*SZ,SZ-4,SZ-4)});
  }
  px.globalAlpha=1;
}

function activeIdx(t){let k=0;SCENES.forEach((s,i)=>{if(t>=s.start)k=i});return k}
const cut=document.getElementById('cut');
const bgL=document.getElementById('bgL'),bgD=document.getElementById('bgD'),
 face=document.getElementById('face'),fr=document.getElementById('fr'),ring=document.getElementById('ring');

function render(t){
  const k=activeIdx(t),sc=SCENES[k],prev=SCENES[Math.max(0,k-1)];
  const q=sc.plain||prev.plain?1:E.io(prog(t,sc.start,.45));
  const gp=geom[lay(prev)],gc=geom[lay(sc)];
  const g={};for(const key in gc)g[key]=lerp(gp[key],gc[key],k===0?1:q);
  Object.assign(face.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px',borderRadius:g.r+'px'});
  fr.style.width='720px';fr.style.height='1280px';
  fr.style.transform='translate('+(-g.ox)+'px,'+(-g.oy)+'px) scale('+g.s+')';
  Object.assign(cut.style,{left:(g.x-g.ox)+'px',top:(g.y-g.oy)+'px',width:(720*g.s)+'px',height:(1280*g.s)+'px',clipPath:'inset(0 '+Math.max(0,720*g.s-g.ox-g.w)+'px '+(g.bw>0.5?Math.max(0,1280*g.s-g.oy-150):0)+'px '+Math.max(0,g.ox)+'px)'});
  Object.assign(ring.style,{left:g.x+'px',top:g.y+'px',width:g.w+'px',height:g.h+'px',borderRadius:g.r+'px',borderWidth:g.bw+'px',
    boxShadow:g.bw>0.5?'0 0 36px rgba(255,190,0,.45)':'none'});
  const dk=lerp(isDark(prev)||prev.layout==='full'?1:0,isDark(sc)||sc.layout==='full'?1:0,k===0?1:E.io(prog(t,sc.start,.3)));
  bgD.style.opacity=dk;bgL.style.opacity=1;
  // cenas
  built.forEach((b,i)=>{
    const s=b.sc,u=t-s.start,end=(SCENES[i+1]?SCENES[i+1].start:TOTAL),dur=end-s.start;
    const vis=t>=s.start-.001&&t<end+.2;b.root.style.display=vis?'block':'none';if(!vis)return;
    const fadeOut=1-E.io(prog(t,end-.22,.22));
    b.root.style.opacity=i===SCENES.length-1?1:fadeOut;
    b.items.forEach(it=>{
      const p=prog(u,it.t0,it.kind==='slide'?.5:.45),el=it.el;
      const rot=parseFloat(el.dataset.rot||0);
      if(it.kind==='slide'){el.style.opacity=E.out(p);el.style.transform='translateY('+(1-E.out(p))*50+'px)'}
      else if(it.kind==='pop'||it.kind==='stamp'){
        const bp=E.back(p),sc0=it.kind==='stamp'?2.2:.5;
        el.style.opacity=it.kind==='stamp'?clamp(p*3):E.out(p);
        el.style.transform='rotate('+(rot+(it.o.rot0||0)*(1-bp))+'deg) scale('+lerp(sc0,1,bp)+')';
        if(el._blink)el.style.opacity=E.out(p)*(Math.floor(u*2)%2?.35:1);
        if(it.kind==='pop'&&sc.card&&sc.card.type==='stamp'&&el.classList.contains('card')){
          const sp=prog(u,sc.card.stampAt??1.3,.2);el.style.opacity=E.out(p)*(1-.35*sp)}
      }
      else if(it.kind==='bar'){
        el.style.opacity=E.out(prog(u,it.t0,.3));
        const bp=E.out(prog(u,it.t0+.15,.9));el._fill.style.width=(600*parseFloat(el.dataset.w)*bp)+'px'}
      else if(it.kind==='counter'){
        const e=E.out(prog(u,it.t0,.4));el.style.opacity=e;el.style.transform='translateY('+(1-e)*40+'px)';
        const v=Math.round(parseFloat(el.dataset.val)*E.out(prog(u,it.t0+.25,1.1)));
        el._num.textContent=el.dataset.pre+v}
    });
  });
  drawPx(t);
}
async function setFrame(i,t){
  const nm=String(i+1).padStart(5,'0');
  fr.src='frames/f'+nm+'.jpg';
  const plain=SCENES[activeIdx(t)].plain;
  cut.style.display=plain?'none':'block';
  if(!plain)cut.src='cuts/f'+nm+'.png';
  await Promise.all([fr.decode(),...(plain?[]:[cut.decode()])]);
  render(t);
}
window.setFrame=setFrame;
if(location.hash==='#guide')document.getElementById('guide').style.display='block';
</script></body></html>
