<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'XB';src:url('fonts/Inter-ExtraBold.otf')}
@font-face{font-family:'SB';src:url('fonts/Inter-SemiBold.otf')}
@font-face{font-family:'MD';src:url('fonts/Inter-Medium.otf')}
@font-face{font-family:'SF';src:url('fonts/InstrumentSerif-Italic.ttf');font-style:italic}
@font-face{font-family:'EMO';src:url('fonts/NotoColorEmoji-Regular.ttf')}
:root{--a:#FD550A;--on-a:#fff;--ink:#0d0d0d;--red:#E5322D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#fff}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;font-family:'SB';transform-origin:50% 45%}
.bg{position:absolute;inset:0}
#bgL{background:radial-gradient(circle,rgba(0,0,0,.11) 1.2px,transparent 1.7px) 11px 11px/22px 22px,#fff}
#bgD{background:#03110d}
#bgD .glow{position:absolute;inset:0}
#bgD .dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.07) 1.2px,transparent 1.7px) 11px 11px/22px 22px}
#sq{position:absolute;inset:0}
#face{position:absolute;overflow:hidden;background:#000}
#face img{position:absolute;left:0;top:0;transform-origin:0 0}
#ring{position:absolute;pointer-events:none;border-style:solid;border-color:var(--a)}
#cut{position:absolute;pointer-events:none;transform-origin:0 0}
.scene{position:absolute;inset:0;pointer-events:none}
.abs{position:absolute}
.tl{position:absolute;font-family:'XB';line-height:1;letter-spacing:-.035em;white-space:nowrap}
.sf{font-family:'SF';font-style:italic;font-weight:400;letter-spacing:-.01em;font-size:1.1em}
.ac{color:var(--a)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .04em .18em;margin:-.06em -.04em -.18em}
.wi{display:inline-block}
.hl{position:relative;z-index:0;display:inline-block}
.hl .mk{position:absolute;left:-.07em;right:-.07em;top:.14em;bottom:.0em;background:var(--yl);z-index:-1;transform-origin:0 50%;border-radius:.1em;transform:scaleX(0)}
.light .tl,.light .tx{color:var(--ink)}
.dark .tl,.dark .tx{color:#fff}
.onvideo .tl,.onvideo .tx{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.sub{position:absolute;font-family:Menlo,'SF Mono','DejaVu Sans Mono',monospace;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.sub .car{position:relative;display:inline-block;width:0}.sub .car i{position:absolute;left:1px;top:-1px;font-style:normal;color:var(--a)}
.light .sub{color:#6b6b70}.dark .sub,.onvideo .sub{color:#a3a3ad}
.mono{font-family:Menlo,'SF Mono','DejaVu Sans Mono',monospace}
.pill{position:absolute;white-space:nowrap;border-radius:12px;padding:10px 16px;font-family:'XB';font-size:23px;letter-spacing:-.4px;line-height:1.1}
.emoji{font-family:'Apple Color Emoji','EMO','Noto Color Emoji',sans-serif;display:inline-block;vertical-align:-.06em;margin-right:7px}
.pill.a,.pill.y{background:var(--a);color:var(--on-a)}
.pill.w{background:#fff;color:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.13);border:1px solid rgba(0,0,0,.06)}
.pill.k{background:#141416;color:#fff}
.pill.r{background:var(--red);color:#fff}
.pill.g{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16)}
.pill.o{background:transparent;color:var(--a);border:2px solid var(--a)}
.pill.v{background:var(--g);color:#fff}
.pill.l{background:var(--yl);color:var(--ink)}
.pill .lt{margin-right:9px;vertical-align:-.28em}
.glass{position:absolute;background:rgba(18,19,24,.86);border:1px solid rgba(255,255,255,.12);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.wcard{position:absolute;background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.12)}
.ico{position:absolute;display:flex;align-items:center;justify-content:center}
.photo{position:absolute}
.photo img{display:block;width:100%;object-fit:cover}
.lt{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.08)}
.logo{position:absolute;display:flex;justify-content:center}
.logo .lbl{position:absolute;top:100%;margin-top:10px;font-family:XB;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.light .logo .lbl{color:var(--ink)}.dark .logo .lbl,.onvideo .logo .lbl{color:#fff}
.ptc{position:absolute;left:0;top:0}
.cursor{position:absolute;left:0;top:0;width:34px;height:42px;transform-origin:0 0;z-index:60;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.rip{position:absolute;width:60px;height:60px;border-radius:30px;border:3px solid var(--a);opacity:0;z-index:59}
/* celular */
.phone{position:absolute;width:320px;height:656px;transform-origin:50% 0}
.phone .pb{position:absolute;inset:0;border-radius:52px;background:#121214;box-shadow:inset 0 0 0 2px #3b3b40,0 40px 90px rgba(0,0,0,.38)}
.phone .ps{position:absolute;left:10px;top:10px;width:300px;height:636px;border-radius:43px;overflow:hidden;background:#fff;color:#0d0d0d;font-family:SB}
.phone .di{position:absolute;left:105px;top:10px;width:90px;height:27px;border-radius:14px;background:#000;z-index:30}
.phone .st b{display:block;font-family:XB;font-size:17px;letter-spacing:-.3px}
.phone .st span{font-family:MD;font-size:12px;color:#333}
.phone .tile{position:absolute;overflow:hidden;display:flex;align-items:center;justify-content:center}
.phone .tile img{width:100%;height:100%;object-fit:cover}
.phone .btn{position:absolute;left:16px;top:230px;width:268px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:SB;font-size:14px}
.nt{position:absolute;left:8px;width:284px;min-height:62px;border-radius:20px;background:rgba(246,246,248,.96);box-shadow:0 10px 30px rgba(0,0,0,.2);padding:11px 12px 11px 56px;font-family:SB;font-size:12.5px;color:#0d0d0d;line-height:1.28;white-space:normal}
.nt .ni{position:absolute;left:11px;top:12px}
.nt b{font-family:XB;font-size:13px}.nt .nw{float:right;color:#8a8a8e;font-size:11px;font-family:MD}
svg{display:block}
#px{position:absolute;inset:0;pointer-events:none}
#bgs,#behind{position:absolute;inset:0;pointer-events:none}
.bgc{position:absolute;inset:0;overflow:hidden}
.bgc img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.bgc .shade{position:absolute;inset:0}
.big{position:absolute;left:0;width:720px;text-align:center;font-family:XB;line-height:.86;letter-spacing:-.05em;white-space:nowrap}
.win .bar{position:absolute;left:0;right:0;top:0;height:46px;border-bottom:1px solid rgba(127,127,127,.18);display:flex;align-items:center;padding-left:18px;gap:7px}
.win .bar i{width:11px;height:11px;border-radius:6px;display:block}
.win .url{position:absolute;left:96px;right:18px;top:10px;height:26px;border-radius:13px;font:13px Menlo,'DejaVu Sans Mono',monospace;display:flex;align-items:center;padding-left:12px;white-space:nowrap;overflow:hidden}
.win .sk{position:absolute;height:14px;border-radius:7px}
.scan{position:absolute;left:0;right:0;height:3px;box-shadow:0 0 18px 4px var(--a);background:var(--a)}
.hudc{position:absolute;width:38px;height:38px;border-color:var(--yl);border-style:solid;border-width:0}
.hudl{position:absolute;font:700 22px Menlo,'DejaVu Sans Mono',monospace;letter-spacing:1px;padding:7px 12px;border-radius:6px;white-space:nowrap;background:var(--yl);color:#0d0d0d}
#guide{position:absolute;pointer-events:none;display:none}
#guide div{position:absolute;border:2px dashed #ff2d95;background:rgba(255,45,149,.07)}
</style></head>
<body><div id="stage">
<div class="bg" id="bgL"></div>
<div class="bg" id="bgD"><div class="glow" id="glow"></div><div class="dots"></div><canvas id="sq" width="720" height="1280"></canvas></div>
<div id="bgs"></div>
<div id="face"><img id="fr"></div><div id="ring"></div><div id="behind"></div><img id="cut">
<div id="layer"></div>
<canvas id="px" width="720" height="1280"></canvas>
<div id="guide"><div style="left:47px;top:167px;width:650px;height:573px"></div><div style="left:47px;top:740px;width:544px;height:283px"></div></div>
</div>
<script>
const CFG = /*CONFIG*/{};
const SCENES = /*SCENES*/[];
const TOTAL = /*TOTAL*/10;
const LOGOS = /*LOGOS*/{};
// Kit de marca: Mandarin Orange (destaque), Forest Green, Crest Yellow
const A = CFG.accent || '#FD550A';
const GREEN = CFG.green || '#015D47';
const YELLOW = CFG.yellow || '#E0F354';
const hex = h => {h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]};
const rgba = (h,a) => 'rgba('+hex(h).join(',')+','+a+')';
const lum = h => {const c=hex(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const ON_A = lum(A) > .45 ? '#0d0d0d' : '#fff';
const colorOf = c => ({accent:A,green:GREEN,yellow:YELLOW})[c]||c;
document.documentElement.style.setProperty('--a', A);
document.documentElement.style.setProperty('--on-a', ON_A);
document.documentElement.style.setProperty('--g', GREEN);
document.documentElement.style.setProperty('--yl', YELLOW);
document.getElementById('glow').style.background =
  'radial-gradient(ellipse 75% 50% at 72% 78%,'+rgba(GREEN,.55)+',transparent 72%),'+
  'radial-gradient(ellipse 60% 35% at 15% 8%,'+rgba(A,.14)+',transparent 70%)';

const clamp=x=>Math.min(1,Math.max(0,x));
const prog=(t,a,d)=>clamp((t-a)/d);
// spring = mola com leve overshoot (~10%) que assenta sem quicar
const E={out:x=>1-Math.pow(1-x,3),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 back:x=>{const c=1.70158,k=c+1;return 1+k*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
 spring:x=>x>=1?1:1-Math.exp(-6.5*x)*Math.cos(9.5*x)};
const lerp=(a,b,q)=>a+(b-a)*q;
const ICON={
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="#0d0d0d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="'+ON_A+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
 cursor:'<svg viewBox="0 0 34 42" width="34" height="42"><path d="M2 2 L2 33 L10 25.5 L15.5 38.5 L21.5 36 L16 23.5 L27 23.5 Z" fill="#0d0d0d" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.7 1.2 5.4 3.2 1.7-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>'
};
const IG_GRAD='radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)';
// logo oficial (Simple Icons) como ícone de app; plain = só o símbolo na cor da marca
function logoHTML(name,sz,o={}){
  const d=LOGOS[name];if(!d)return '';
  const light=lum(d.hex)>.5, white=o.tile==='white';
  const bg=white?'#fff':name==='instagram'?IG_GRAD:d.hex;
  const gl=o.plain||white?(name==='instagram'&&white?'#d6249f':d.hex):(light?'#0d0d0d':'#fff');
  const filt=name==='tiktok'?'filter:drop-shadow(-.06em -.04em 0 #25F4EE) drop-shadow(.06em .04em 0 #FE2C55);font-size:'+sz+'px;':'';
  const g=o.plain?sz:sz*.58;
  const svg='<svg viewBox="0 0 24 24" style="width:'+g+'px;height:'+g+'px;'+filt+'"><path fill="'+gl+'" d="'+d.p+'"/></svg>';
  if(o.plain)return svg;
  const edge=lum(d.hex)<.02&&!white?';box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)':'';
  return '<span class="lt" style="width:'+sz+'px;height:'+sz+'px;border-radius:'+(sz*.26)+'px;background:'+bg+edge+'">'+svg+'</span>';
}
const fmtN=n=>{n=Math.round(n);if(n>=1e6)return (n/1e6).toFixed(1).replace('.0','').replace('.',',')+' mi';
  if(n>=1e4)return (n/1e3).toFixed(1).replace('.0','').replace('.',',')+' mil';return n.toLocaleString('pt-BR')};
// Geometria do rosto em cada layout. s = escala do quadro 720x1280; ox/oy = deslocamento
// do quadro escalado dentro da janela. Sobrescreva em scenes.json: {"geom": {"card": {"oy": 520}}}
const geom={
 card:{x:83,y:666,w:554,h:700,r:28,s:.92,ox:54,oy:556,bw:2.5},
 full:{x:0,y:0,w:720,h:1280,r:0,s:1,ox:0,oy:0,bw:0},
 avatar:{x:500,y:126,w:184,h:184,r:92,s:.49,ox:84,oy:197,bw:3.5},
 pip:{x:400,y:330,w:280,h:350,r:26,s:.52,ox:47,oy:132,bw:2.5},
 pipL:{x:40,y:330,w:280,h:350,r:26,s:.52,ox:47,oy:132,bw:2.5},
 split:{x:0,y:0,w:720,h:640,r:0,s:1,ox:0,oy:60,bw:5},
 cutout:{x:0,y:0,w:720,h:1280,r:0,s:1,ox:0,oy:0,bw:0},
 none:{x:592,y:218,w:0,h:0,r:0,s:.49,ox:84,oy:197,bw:0}};
for(const k in (CFG.geom||{}))geom[k]=Object.assign({},geom[k]||geom.card,CFG.geom[k]);
const lay=s=>({light:'card',dark:'card',full:'full',pip:'pip',pipL:'pipL',split:'split',cutout:'cutout'})[s.layout]||(s.avatar===false?'none':'avatar');
const isCard=s=>lay(s)==='card'&&!s.plain;
// fundo escuro (1) ou claro (0) por cena; "full" herda o anterior
const bgOf=s=>s.bgColor?colorOf(s.bgColor):null;
const DK=[];SCENES.forEach((s,i)=>{const L=s.layout,bc=bgOf(s);
  DK.push(bc?(lum(bc)>.4?0:1):L==='dark'?1:L==='light'?0:L==='full'?(i?DK[i-1]:0):(s.bg==='light'?0:1))});
// tema: "dots" (padrão), "grid" (linhas técnicas) ou "plain"
if(CFG.theme==='grid'){document.getElementById('bgL').style.background='linear-gradient(rgba(0,0,0,.055) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(0,0,0,.055) 1px,transparent 1px) 0 0/48px 48px,#fff';
  document.querySelector('#bgD .dots').style.background='linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/48px 48px'}
if(CFG.theme==='plain'){document.getElementById('bgL').style.background='#fff';document.querySelector('#bgD .dots').style.background='none'}

const escapeText = value => String(value ?? '').replace(/[&<>"']/g, ch =>
  ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[ch]));
// {texto} = serifa itálica, *texto* = cor de destaque, [texto] = marca-texto (combináveis: {*iPhone*})
const inl=t=>escapeText(t).replace(/\{(.+?)\}/g,'<i class="sf">$1</i>').replace(/\*(.+?)\*/g,'<span class="ac">$1</span>').replace(/\[(.+?)\]/g,'<span class="hl" style="color:var(--ink);background:var(--yl);border-radius:.1em;padding:0 .08em">$1</span>');
// título dividido em palavras, cada uma com os estilos ativos
function rich(line){const out=[];let sf=0,ac=0,hl=0,cur='',f=null,g=[];
  const tok=()=>{if(cur){g.push({t:cur,...f});cur=''}};
  const word=()=>{tok();if(g.length){out.push(g);g=[]}};
  for(const ch of String(line)){
    if(ch==='{'){tok();sf=1}else if(ch==='}'){tok();sf=0}
    else if(ch==='*'){tok();ac^=1}else if(ch==='['){tok();hl=1}else if(ch===']'){tok();hl=0}
    else if(ch===' '){word()}else{if(!cur)f={sf,ac,hl};cur+=ch}}
  word();return out}
const layer=document.getElementById('layer');
function mk(cls,html,css){const d=document.createElement('div');d.className=cls;d.innerHTML=html||'';Object.assign(d.style,css||{});return d}
const frImg=document.getElementById('fr');
const notifHTML=n=>'<div class="ni">'+(n.logo&&LOGOS[n.logo]?logoHTML(n.logo,34):'<span class="lt" style="width:34px;height:34px;border-radius:9px;background:'+A+'"><span class="emoji" style="margin:0;font-size:18px">'+escapeText(n.emoji||'🔔')+'</span></span>')+'</div>'+
  '<span class="nw">'+escapeText(n.when||'agora')+'</span><b>'+escapeText(n.title||(LOGOS[n.logo]||{}).title||'')+'</b><div>'+inl(n.text||'')+'</div>';

function build(sc,idx){
  const dark=DK[idx]===1, cls=sc.layout==='full'?'onvideo':dark?'dark':'light';
  const root=mk('scene '+cls);layer.appendChild(root);
  const bgs=mk('bgc');bgs.style.display='none';document.getElementById('bgs').appendChild(bgs);
  if(sc.bgColor||sc.bgImage){bgs.style.background=bgOf(sc)||'#0d0d0d';
    if(sc.bgImage){const im=document.createElement('img');im.src=sc.bgImage;bgs.appendChild(im);bgs._img=im;
      bgs.appendChild(mk('shade','',{background:sc.bgShade??'linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.55))'}))}}
  else bgs._none=1;
  const beh=mk('scene '+cls);document.getElementById('behind').appendChild(beh);
  const items=[];let n=0;
  const add=(el,kind,o={})=>{if(!o.child)root.appendChild(el);items.push({el,kind,t0:.1+(o.delay??n*.1),o});n++;return el};
  const plate=dark||sc.layout==='full'?'glass':'wcard';
  const al=sc.titleAlign||'center';
  const place=(x)=>al==='center'&&x==null?{left:'0',width:'720px',textAlign:'center'}:{left:(x??sc.titleX??48)+'px'};
  const clicks=[];
  // palavra gigante ATRÁS da pessoa (combine com layout "cutout" ou "full")
  if(sc.bigword){const B=sc.bigword,sz=B.size||200;let y=B.y??170;
    String(B.text).split('|').forEach((ln,i)=>{const col=B.color?colorOf(B.color):(dark||sc.layout==='full'?'#fff':'#0d0d0d');
      const el=mk('big',inl(ln),{top:y+'px',fontSize:sz+'px',color:col});
      if(B.style==='outline'){el.style.color='transparent';el.style.webkitTextStroke=Math.max(2,sz/60)+'px '+col}
      el.dataset.rot=B.rot||0;beh.appendChild(el);add(el,B.anim||'slam',{child:1,delay:(B.delay??0)+i*.14});y+=Math.round(sz*.86)})}
  let yy=sc.titleY??170;
  if(sc.title){
    const ts=sc.titleSize||56, lh=Math.round(ts*1.06);let wi=0,mi=0;
    sc.title.split('|').forEach((l,i)=>{
      const tl=mk('tl','',{top:(yy+i*lh)+'px',fontSize:ts+'px',...place()});root.appendChild(tl);
      const ws=rich(l);
      ws.forEach((g,j)=>{
        const w=document.createElement('span');w.className='w';const inner=document.createElement('span');inner.className='wi';
        g.forEach(k=>{const s=document.createElement(k.sf?'i':'span');s.className=(k.sf?'sf ':'')+(k.ac?'ac ':'')+(k.hl?'hl':'');s.textContent=k.t;
          if(k.hl){const m=document.createElement('span');m.className='mk';s.appendChild(m);add(m,'mark',{child:1,delay:(sc.marks||[])[mi++]??((sc.titleDelay??0)+wi*.06+.32),dark})}
          inner.appendChild(s)});
        w.appendChild(inner);tl.appendChild(w);if(j<ws.length-1)tl.appendChild(document.createTextNode(' '));
        add(inner,'word',{child:1,delay:(sc.titleDelay??0)+wi*.06});wi++;
      });
    });
    yy+=sc.title.split('|').length*lh;
  }
  if(sc.sub){const el=mk('sub','',{top:(yy+12)+'px',...place()});el.dataset.full=sc.sub;add(el,'type',{delay:.35})}
  (sc.texts||[]).forEach(x=>{
    const el=mk('tx abs',inl(x.text),{left:(x.x??48)+'px',top:x.y+'px',fontSize:(x.size||26)+'px',whiteSpace:'nowrap',
      fontFamily:x.font==='mono'?"Menlo,'DejaVu Sans Mono',monospace":x.font==='sf'?'SF':x.font==='sb'?'SB':'XB',fontStyle:x.font==='sf'?'italic':'normal',
      letterSpacing:x.font==='mono'?'0':'-.02em',...(x.color?{color:colorOf(x.color)}:{})});
    if(x.align==='center'){el.style.left='0';el.style.width='720px';el.style.textAlign='center'}
    el.dataset.rot=x.rot||0;add(el,x.anim||'slide',{delay:x.delay});
  });
  (sc.images||[]).forEach(m=>{
    const pol=m.frame==='polaroid',circ=m.mask==='circle',h=circ?m.w:m.h;

    if(c.scan!==false){const sl=mk('scan','',{background:col,boxShadow:'0 0 18px 4px '+col});box.appendChild(sl);add(sl,'scan',{child:1,delay:(c.delay??.1)+.2,dur:c.scanDur??1.4,loop:true})}
    add(box,'hud',{delay:c.delay??.1});
    const lb=mk('hudl','',{left:X+'px',top:(Y-54)+'px',background:col});add(lb,'hudtxt',{delay:c.delay??.1,label:c.label||'ANALISANDO',result:c.result||'IA {v}%',value:c.value??87,vAt:c.valueAt??1.6});
  }
  // partículas: estouro de confete/emoji ou corações subindo
  (sc.bursts||[]).forEach((B,bi)=>{let s=(bi+1)*9973+idx*131+7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
    const rise=B.mode==='rise',cnt=B.n??(rise?10:18);
    for(let i=0;i<cnt;i++){
      const em=B.emoji?(Array.isArray(B.emoji)?B.emoji[i%B.emoji.length]:B.emoji):null;
      const el=em?mk('ptc','<span class="emoji" style="margin:0;font-size:'+(B.size||34)+'px">'+escapeText(em)+'</span>'):
        mk('ptc','',{width:'12px',height:'18px',borderRadius:'3px',background:(B.colors||[A,GREEN,YELLOW,'#fff'])[i%(B.colors||[0,0,0,0]).length]});
      const ang=-Math.PI/2+(r()-.5)*(B.spread??2.8),v=420+r()*480;

      add(el,'pt',{delay:(B.at??0)+(rise?i*((B.dur??2)/cnt):r()*.06)});

  const kf=(sc.cursor||[]).map(f=>({...f,at:.1+f.at})).concat(clicks.map(f=>({...f,at:.1+f.at,click:true}))).sort((a,b)=>a.at-b.at);
  if(kf.length){const rp=mk('rip');root.appendChild(rp);const cu=mk('cursor',ICON.cursor);cu._rip=rp;add(cu,'cursor',{delay:-.1,kf})}

}
const built=SCENES.map(build);

// quadradinhos do fundo escuro
const sqx=document.getElementById('sq').getContext('2d');
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const BG_SQ=[];for(let i=0;i<34;i++)BG_SQ.push({x:Math.floor(rnd()*21)*34+4,y:Math.floor(rnd()*37)*34+4,a:.05+rnd()*.13,f:.6+rnd()*1.4,p:rnd()*6});

// transições opcionais: "pixels" (quadrados) e "swipe" (faixa diagonal na cor de destaque)
const px=document.getElementById('px').getContext('2d');
const COLS=8,SZ=90,ROWS=15;
const sq=[];for(let i=0;i<COLS*ROWS;i++){sq.push({r:rnd(),on:rnd()<.5,c:[A,GREEN,YELLOW,'#fff'][Math.floor(rnd()*4)]})}
function drawPx(t){
  px.clearRect(0,0,720,1280);

    const tr=SCENES[k].transition,tb=SCENES[k].start;

      const a=tb-.30+s.r*.25,b=tb+.05+s.r*.25;

    if(tr==='glitch'&&Math.abs(t-tb)<.22){let g=Math.floor(t*30)*7919+k*104729;const gr=()=>{g=(g*16807)%2147483647;return g/2147483647};
      const cols=[A,GREEN,YELLOW,'#ffffff','#0d0d0d'];
      for(let b=0;b<11;b++){px.globalAlpha=.55+gr()*.4;px.fillStyle=cols[Math.floor(gr()*5)];
        const y=gr()*1280,h=4+gr()*70;px.fillRect(gr()*-200,y,720*(.4+gr()*.9),h)}
      px.globalAlpha=.18;px.fillStyle='#000';for(let y=0;y<1280;y+=6)px.fillRect(0,y,720,2);px.globalAlpha=1}
    if(tr==='swipe'){const p=(t-(tb-.3))/.6;if(p<0||p>1)continue;
      const x=lerp(-1900,1900,E.io(p));px.save();px.translate(360+x,640);px.rotate(-.33);
      px.fillStyle=GREEN;px.fillRect(-820,-1400,120,2800);

}

function activeIdx(t){let k=0;SCENES.forEach((s,i)=>{if(t>=s.start)k=i});return k}
function state(t){
  const k=activeIdx(t),sc=SCENES[k],pk=Math.max(0,k-1),prev=SCENES[pk];
  const hard=k===0||sc.plain||prev.plain||sc.cut==='hard'||sc.layout==='cutout'||prev.layout==='cutout';
  const q=hard?1:E.io(prog(t,sc.start,.45));
  const ca=isCard(sc)?(hard||isCard(prev)?1:q):(!hard&&isCard(prev)?1-q:0);
  return {k,sc,pk,prev,q,ca};
}

const stage=document.getElementById('stage'),bgL=document.getElementById('bgL');

function render(t){

  bgL.style.backgroundPosition='11px '+(11+(t*9)%22).toFixed(2)+'px,0 0';

  const kick=k>0&&!sc.plain&&sc.kick!==false?(1-E.out(prog(t,sc.start,.42)))*.03:0;
  let tx=0,blur=0,zs=1;
  for(let k2=1;k2<SCENES.length;k2++){const S=SCENES[k2],dd=t-S.start,tr=S.transition;
    if(tr==='whip'&&Math.abs(dd)<.2){const e=Math.pow(1-Math.abs(dd)/.2,2);tx=(dd<0?-1:1)*e*520;blur=e*24}
    if(tr==='zoom'&&Math.abs(dd)<.22){const e=Math.pow(1-Math.abs(dd)/.22,2);zs=1+e*.45;blur=e*16}
    if(tr==='glitch'&&Math.abs(dd)<.22){const f=Math.floor(t*30);tx=((f*9301+49297)%233280/233280-.5)*36}}

    let shake=0;
    b.items.forEach((it,j)=>{
      const el=it.el,o=it.o,d=u-it.t0,rot=parseFloat(el.dataset.rot||0);
      const bob=o.float&&d>.5?Math.sin(u*2.1+j*1.7)*3.2*clamp((d-.5)*2):0;

      case 'swing':{const p=prog(u,it.t0,.6),s=E.spring(p);el.style.opacity=clamp(p*4);el.style.transform='translateX('+(1-s)*-120+'px) rotate('+(1-s)*-4+'deg)';break}

      case 'pop':{const p=prog(u,it.t0,.6),s=E.spring(p),s0=o.s0??.4;el.style.opacity=el._blink?E.out(p)*(Math.floor(u*2)%2?.35:1):clamp(p*4);

      case 'deal':{const p=prog(u,it.t0,.75),s=E.spring(p);el.style.opacity=clamp(p*5);el.style.transform='translateY('+((1-s)*760+bob)+'px) rotate('+(rot+(1-s)*28)+'deg)';break}
      case 'rise':{const p=prog(u,it.t0,.8),s=E.spring(p);el.style.opacity=clamp(p*5);el.style.transform='translateY('+((1-s)*900+bob)+'px) rotate('+(rot+(1-s)*8)+'deg) scale('+(el._k||1)+')';break}
      case 'stamp':{const p=prog(u,it.t0,.45),s=E.spring(p);el.style.opacity=clamp(p*5);el.style.transform='rotate('+rot+'deg) scale('+lerp(2.4,1,s)+')';
        if(d>.08&&d<.3)shake=Math.max(shake,(1-(d-.08)/.22)*7);break}
      case 'slam':{const p=prog(u,it.t0,.5),s=E.spring(p);el.style.opacity=clamp(p*6);el.style.transform='rotate('+rot+'deg) scale('+lerp(1.9,1,s)+')';
        const m=d>0&&d<.24?(1-d/.24)*6:0;el.style.textShadow=m?(-m)+'px 0 '+A+','+m+'px 0 '+GREEN:'';
        if(d>.06&&d<.26)shake=Math.max(shake,(1-(d-.06)/.2)*6);break}
      case 'scan':{const p=o.loop?((d%o.dur)+o.dur)%o.dur/o.dur:prog(u,it.t0,o.dur);el.style.opacity=d>=0&&(o.loop||p<1)?1:0;el.style.top=(p*100).toFixed(2)+'%';break}
      case 'hud':{const p=prog(u,it.t0,.6),s=E.spring(p);el.style.opacity=d<0?0:(d<.35&&Math.floor(d*20)%2?.3:1);el.style.transform='scale('+lerp(1.45,1,s)+')';break}
      case 'hudtxt':{el.style.opacity=d<0?0:1;
        if(d<0)break;if(u<.1+o.vAt){el.textContent=o.label+' '+'.'.repeat(1+Math.floor(d*5)%3)}

        const v=parseFloat(el.dataset.val)*E.out(prog(u,it.t0+.2,1.1));el._num.textContent=el.dataset.pre+(v>=1e4?Math.round(v).toLocaleString('pt-BR'):Math.round(v));break}
      case 'chart':{const e=E.out(prog(u,it.t0,.4));el.style.opacity=e;el.style.transform='translateY('+(1-e)*30+'px)';

}
